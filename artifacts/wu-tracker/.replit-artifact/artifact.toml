kind = "web"
previewPath = "/"
title = "Western Union - تتبع تحويل"
version = "1.0.0"
id = "artifacts/wu-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25734

[services.development]
run = "pnpm --filter @workspace/wu-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wu-tracker", "run", "build" ]
publicDir = "artifacts/wu-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25734"
BASE_PATH = "/"
